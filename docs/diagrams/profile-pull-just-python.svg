<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 848" font-family="Arial, Helvetica, sans-serif">
<defs>
  <defs>
    <style>
      .head  { font-family: Georgia, 'Times New Roman', serif; }
      .body  { font-family: Arial, Helvetica, sans-serif; }
      .fg    { fill: #1B4332; }
      .fw    { fill: #FFFFFF; }
      .fmute { fill: #52796F; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1B4332"/>
    </marker>
    <symbol id="ic-cloud" viewBox="0 0 24 24">
      <path d="M6.5 18 C3.5 18 2 15.8 2 13.8 C2 11.6 3.8 10 5.8 10.1 C6.4 7.6 8.7 6 11.2 6.3 C13.6 6.6 15.4 8.6 15.5 11 C17.9 11.1 20 13 20 15.3 C20 17.4 18.2 18 17 18 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-box" viewBox="0 0 24 24">
      <path d="M3 8 L12 4 L21 8 L12 12 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M3 8 V17 L12 21 V12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M21 8 V17 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="3" y="14" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="7" cy="7" r="1" fill="currentColor"/>
      <circle cx="7" cy="17" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ic-monitor" viewBox="0 0 24 24">
      <rect x="2.5" y="4" width="19" height="13" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-folder" viewBox="0 0 24 24">
      <path d="M3 6.5 C3 5.7 3.7 5 4.5 5 H9.5 L11.5 7.5 H19.5 C20.3 7.5 21 8.2 21 9 V17.5 C21 18.3 20.3 19 19.5 19 H4.5 C3.7 19 3 18.3 3 17.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24">
      <path d="M6 3 H14 L19 8 V20 C19 20.6 18.6 21 18 21 H6 C5.4 21 5 20.6 5 20 V4 C5 3.4 5.4 3 6 3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14 3 V8 H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="15.5" x2="16" y2="15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="19" x2="12.5" y2="19" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-terminal" viewBox="0 0 24 24">
      <rect x="2.5" y="4" width="19" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M6.5 9 L10.5 12 L6.5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="15" x2="17" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>
</defs>
<rect x="0" y="0" width="1000" height="848" fill="#FFFFFF"/>

  <g transform="translate(40,20)">
    <path d="M12 42 V16" stroke="#1B4332" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M12 23 C12 14 5 12 0 14 C0 21 5 25 12 23 Z" fill="#74C69D" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12 19 C12 11 20 9 25 11 C25 18 20 22 12 19 Z" fill="#95D5B2" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">Just Python</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">Interpreters and venvs only -- installs straight from the internet</text>

<rect x="640" y="110" width="320" height="64" rx="12" fill="#52796F"/><use href="#ic-terminal" x="656" y="122" width="20" height="20" color="#FFFFFF"/><text x="684" y="137" class="body fw" font-size="14.0" font-weight="700">install.cmd  /  the one-liner</text><text x="656" y="151" class="body" fill="#CFE3D6" font-size="10" font-style="italic">you (or a script) run this -- on each machine, once</text>
<line x1="800" y1="174" x2="800" y2="320" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="202" width="320" height="94" rx="12" fill="#1B4332"/>
<use href="#ic-doc" x="58" y="215" width="22" height="22" color="#FFFFFF"/>
<text x="92" y="230" class="body fw" font-size="14" font-weight="700">global.conf</text>
<text x="58" y="246" class="body" fill="#CFE3D6" font-size="10" font-style="italic">read at install, on every machine</text>
<line x1="58" y1="256" x2="342" y2="256" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
<rect x="58" y="264" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="67" y="279" class="body fg" font-size="11.5" font-weight="600">SEEDLING_PROFILE  →  profile.toml</text>
<line x1="360" y1="249" x2="796" y2="249" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="580" y="241" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">sets SEEDLING_PROFILE</text>
<rect x="640" y="324" width="320" height="134" rx="12" fill="#1B4332"/>
<use href="#ic-doc" x="658" y="337" width="22" height="22" color="#FFFFFF"/>
<text x="692" y="352" class="body fw" font-size="14.0" font-weight="700">profile.toml</text>
<text x="658" y="368" class="body" fill="#CFE3D6" font-size="10" font-style="italic">one file, read at install and every</text>
<text x="658" y="380" class="body" fill="#CFE3D6" font-size="10" font-style="italic">later `seed apply`</text>
<line x1="658" y1="390" x2="942" y2="390" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
<rect x="658" y="398" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="413" class="body fg" font-size="11.5" font-weight="600">python = [...]  →  python/base/</text>
<rect x="658" y="426" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="441" class="body fg" font-size="11.5" font-weight="600">[[venv]]  →  python/venvs/</text>
<line x1="800" y1="458" x2="800" y2="488" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="810" y="479" class="body fmute" font-size="10.5" font-style="italic">install + seed apply</text>
<rect x="640" y="492" width="320" height="306" rx="12" fill="#EAF3EE" stroke="#1B4332" stroke-width="1.2"/>
<use href="#ic-monitor" x="662" y="496" width="24" height="24" color="#1B4332"/>
<text x="696" y="513" class="body fg" font-size="15" font-weight="700">YOUR MACHINE</text>
<text x="662" y="530" class="body fmute" font-size="11.5" font-style="italic">the one venv, straight from the</text>
<text x="662" y="545" class="body fmute" font-size="11.5" font-style="italic">internet</text>
<line x1="662" y1="550" x2="938" y2="550" stroke="#1B4332" stroke-width="1" opacity="0.25"/>
<text x="662" y="561" class="body fg" font-size="10.5" font-weight="700" letter-spacing="0.6">WHAT THE USER HAS</text>
<rect x="654" y="575" width="292" height="42" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="581" width="15" height="15" color="#1B4332"/>
<text x="681" y="592" class="body fg" font-size="12.0" font-weight="700">system/src/</text>
<text x="681" y="603" class="body fmute" font-size="9.5" font-style="italic">seedling's own source</text>
<rect x="654" y="629" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="635" width="15" height="15" color="#1B4332"/>
<text x="681" y="646" class="body fg" font-size="12.0" font-weight="700">python/base/</text>
<text x="681" y="657" class="body fmute" font-size="9.5" font-style="italic">interpreters</text>
<rect x="664" y="661" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="676" class="body fg" font-size="11.5" font-weight="600">3.13</text>
<rect x="654" y="704" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="710" width="15" height="15" color="#1B4332"/>
<text x="681" y="721" class="body fg" font-size="12.0" font-weight="700">python/venvs/</text>
<text x="681" y="732" class="body fmute" font-size="9.5" font-style="italic">one folder per venv</text>
<rect x="664" y="736" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="750" class="body fg" font-size="11.5" font-weight="600">work</text>
<rect x="40" y="492" width="470" height="92" rx="12" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.3"/>
<use href="#ic-cloud" x="56" y="504" width="20" height="20" color="#1B4332"/>
<text x="84" y="519" class="body fg" font-size="15.0" font-weight="700">github.com</text>
<text x="84" y="533" class="body fmute" font-size="11.0" font-style="italic">the public seedling repo</text>
<rect x="54" y="538" width="442" height="32" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="66" y="559" class="body fg" font-size="13.0" font-weight="700">seedling itself</text>
<line x1="510" y1="554" x2="636" y2="554" stroke="#1B4332" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="575" y="548" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">the install one-liner</text>
<rect x="40" y="610" width="470" height="92" rx="12" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.3"/>
<use href="#ic-cloud" x="56" y="622" width="20" height="20" color="#1B4332"/>
<text x="84" y="637" class="body fg" font-size="15.0" font-weight="700">pypi.org</text>
<text x="84" y="651" class="body fmute" font-size="11.0" font-style="italic">package index</text>
<rect x="54" y="656" width="442" height="32" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="66" y="677" class="body fg" font-size="13.0" font-weight="700">Packages</text>
<line x1="510" y1="672" x2="636" y2="672" stroke="#1B4332" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="575" y="666" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">seed venv</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1010" viewBox="0 0 1180 1010" role="img" aria-label="The offline bundle as the superset of everything on the air-gapped network, with deployment profiles drawn as subsets inside it, a profile that asks for more drawn outside it, and global.conf outside pointing in.">
  <rect width="1180" height="1010" fill="#FFFFFF"/>

  <defs>
    <style>
      .head  { font-family: Georgia, 'Times New Roman', serif; }
      .body  { font-family: Arial, Helvetica, sans-serif; }
      .fg    { fill: #1B4332; }
      .fw    { fill: #FFFFFF; }
      .fmute { fill: #52796F; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1B4332"/>
    </marker>
    <symbol id="ic-cloud" viewBox="0 0 24 24">
      <path d="M6.5 18 C3.5 18 2 15.8 2 13.8 C2 11.6 3.8 10 5.8 10.1 C6.4 7.6 8.7 6 11.2 6.3 C13.6 6.6 15.4 8.6 15.5 11 C17.9 11.1 20 13 20 15.3 C20 17.4 18.2 18 17 18 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-box" viewBox="0 0 24 24">
      <path d="M3 8 L12 4 L21 8 L12 12 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M3 8 V17 L12 21 V12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M21 8 V17 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="3" y="14" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="7" cy="7" r="1" fill="currentColor"/>
      <circle cx="7" cy="17" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ic-monitor" viewBox="0 0 24 24">
      <rect x="2.5" y="4" width="19" height="13" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-folder" viewBox="0 0 24 24">
      <path d="M3 6.5 C3 5.7 3.7 5 4.5 5 H9.5 L11.5 7.5 H19.5 C20.3 7.5 21 8.2 21 9 V17.5 C21 18.3 20.3 19 19.5 19 H4.5 C3.7 19 3 18.3 3 17.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24">
      <path d="M6 3 H14 L19 8 V20 C19 20.6 18.6 21 18 21 H6 C5.4 21 5 20.6 5 20 V4 C5 3.4 5.4 3 6 3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14 3 V8 H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="15.5" x2="16" y2="15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="19" x2="12.5" y2="19" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-terminal" viewBox="0 0 24 24">
      <rect x="2.5" y="4" width="19" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M6.5 9 L10.5 12 L6.5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="15" x2="17" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>


  <g transform="translate(40,20)">
    <path d="M12 42 V16" stroke="#1B4332" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M12 23 C12 14 5 12 0 14 C0 21 5 25 12 23 Z" fill="#74C69D" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12 19 C12 11 20 9 25 11 C25 18 20 22 12 19 Z" fill="#95D5B2" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">What crosses the air gap</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">The bundle is the superset. A profile is a subset of it. global.conf points at it.</text>

  <rect x="40" y="112" width="700" height="660" rx="16" fill="#E9F5EC" stroke="#1B4332" stroke-width="2.4"/>
  <text x="64" y="148" class="head fg" font-size="19" font-weight="700">The offline bundle</text>
  <text x="64" y="170" class="body fmute" font-size="12.5" font-style="italic">declared by offline-bundle.toml, built once, carried in once</text>
  <text x="716" y="148" class="body fmute" font-size="12" font-weight="700" text-anchor="end">SUPERSET</text>
  <rect x="64" y="194" width="652" height="34" rx="7" fill="#FFFFFF" stroke="#52796F" stroke-width="1.1"/>
  <text x="78" y="216" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">wheels/</text>
  <text x="308" y="216" class="body fmute" font-size="12.5">every distribution any profile may name</text>
  <rect x="64" y="236" width="652" height="34" rx="7" fill="#FFFFFF" stroke="#52796F" stroke-width="1.1"/>
  <text x="78" y="258" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">python-builds/</text>
  <text x="308" y="258" class="body fmute" font-size="12.5">the interpreter archives</text>
  <rect x="64" y="278" width="652" height="34" rx="7" fill="#FFFFFF" stroke="#52796F" stroke-width="1.1"/>
  <text x="78" y="300" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">conda-channel/</text>
  <text x="308" y="300" class="body fmute" font-size="12.5">conda-forge command-line tools</text>
  <rect x="64" y="320" width="652" height="34" rx="7" fill="#FFFFFF" stroke="#52796F" stroke-width="1.1"/>
  <text x="78" y="342" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">vendor/vscode/</text>
  <text x="308" y="342" class="body fmute" font-size="12.5">the editor, with its extensions</text>
  <rect x="64" y="362" width="652" height="34" rx="7" fill="#FFFFFF" stroke="#52796F" stroke-width="1.1"/>
  <text x="78" y="384" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">vendor/uv/, vendor/git/</text>
  <text x="308" y="384" class="body fmute" font-size="12.5">uv, and MinGit when asked for</text>
  <rect x="64" y="404" width="652" height="34" rx="7" fill="#FFFFFF" stroke="#52796F" stroke-width="1.1"/>
  <text x="78" y="426" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">seedling/</text>
  <text x="308" y="426" class="body fmute" font-size="12.5">the source users install from</text>
  <text x="64" y="468" class="body fg" font-size="13.5" font-weight="700">Deployment profiles, each a SUBSET of the above</text>
  <text x="64" y="488" class="body fmute" font-size="12" font-style="italic">installation-profile/*.toml, checked against the bundle before it is built</text>
  <rect x="64.0" y="506" width="206.66666666666666" height="118" rx="10" fill="#D8EEE0" stroke="#1B4332" stroke-width="1.6"/>
  <text x="78.0" y="532" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">dev.toml</text>
  <text x="78.0" y="556" class="body fmute" font-size="11.8">- python 3.12</text>
  <text x="78.0" y="575" class="body fmute" font-size="11.8">- pandas, pytest</text>
  <text x="78.0" y="594" class="body fmute" font-size="11.8">- VS Code</text>
  <rect x="286.66666666666663" y="506" width="206.66666666666666" height="118" rx="10" fill="#D8EEE0" stroke="#1B4332" stroke-width="1.6"/>
  <text x="300.66666666666663" y="532" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">analysis.toml</text>
  <text x="300.66666666666663" y="556" class="body fmute" font-size="11.8">- python 3.12</text>
  <text x="300.66666666666663" y="575" class="body fmute" font-size="11.8">- pandas, numpy</text>
  <text x="300.66666666666663" y="594" class="body fmute" font-size="11.8">- jupyterlab</text>
  <rect x="509.3333333333333" y="506" width="206.66666666666666" height="118" rx="10" fill="#D8EEE0" stroke="#1B4332" stroke-width="1.6"/>
  <text x="523.3333333333333" y="532" class="body fg" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">batch.toml</text>
  <text x="523.3333333333333" y="556" class="body fmute" font-size="11.8">- python 3.11</text>
  <text x="523.3333333333333" y="575" class="body fmute" font-size="11.8">- pandas</text>
  <text x="64" y="652" class="body fmute" font-size="12">Every name resolves inside the box, so `seed apply` works with no network at all.</text>
  <rect x="800" y="300" width="340" height="158" rx="10" fill="#F7ECE9" stroke="#9C4A3C" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="816" y="328" class="body" font-size="13" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" fill="#9C4A3C">reporting.toml</text>
  <text x="816" y="352" class="body fmute" font-size="12.2">- pandas</text>
  <text x="816" y="372" class="body" font-size="12.2" fill="#9C4A3C">- polars      not in the bundle</text>
  <text x="816" y="400" class="body fmute" font-size="12">Outside the superset, so there is nowhere</text>
  <text x="816" y="418" class="body fmute" font-size="12">for it to come from: no index, no share,</text>
  <text x="816" y="436" class="body fmute" font-size="12">no internet.</text>
  <path d="M792 374 L786 374" stroke="#9C4A3C" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M774 362 L750 386 M750 362 L774 386" stroke="#9C4A3C" stroke-width="2.8" stroke-linecap="round"/>
  <text x="1140" y="290" class="body" font-size="11.5" text-anchor="end" font-style="italic" fill="#9C4A3C">caught on the connected machine, not by a user</text>
  <rect x="800" y="492" width="340" height="280" rx="12" fill="#FFFFFF" stroke="#1B4332" stroke-width="2"/>
  <text x="818" y="526" class="head fg" font-size="17" font-weight="700">global.conf</text>
  <text x="818" y="548" class="body fmute" font-size="12" font-style="italic">the user environment configuration</text>
  <text x="818" y="566" class="body fmute" font-size="12" font-style="italic">carries nothing; it says where to look</text>
  <text x="818" y="598" class="body fg" font-size="11.2" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">SEEDLING_PACKAGE_INDEX</text>
  <text x="830" y="615" class="body fmute" font-size="11.2" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">-&gt; wheels/</text>
  <text x="818" y="640" class="body fg" font-size="11.2" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">SEEDLING_PYTHON_MIRROR</text>
  <text x="830" y="657" class="body fmute" font-size="11.2" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">-&gt; python-builds/</text>
  <text x="818" y="682" class="body fg" font-size="11.2" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">SEEDLING_CONDA_CHANNEL</text>
  <text x="830" y="699" class="body fmute" font-size="11.2" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">-&gt; conda-channel/</text>
  <text x="818" y="724" class="body fg" font-size="11.2" font-weight="700" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">SEEDLING_REPO_URL</text>
  <text x="830" y="741" class="body fmute" font-size="11.2" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">-&gt; seedling/</text>
  <path d="M792 632 C730 632 810 542 748 542" stroke="#1B4332" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="776" y="614" class="body fmute" font-size="11.5" text-anchor="end" font-style="italic">every user's machine</text>
  <text x="776" y="630" class="body fmute" font-size="11.5" text-anchor="end" font-style="italic">resolves to the share</text>
  <text x="40" y="980" class="body fmute" font-size="12.5" font-style="italic">Things enter the set only on the connected side. A profile selects from the set; it can never add to it.</text>
</svg>

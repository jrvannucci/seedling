<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 426" font-family="Arial, Helvetica, sans-serif">
<defs>
  <defs>
    <style>
      .head  { font-family: Georgia, 'Times New Roman', serif; }
      .body  { font-family: Arial, Helvetica, sans-serif; }
      .fg    { fill: #1B4332; }
      .fw    { fill: #FFFFFF; }
      .fmute { fill: #52796F; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1B4332"/>
    </marker>
    <symbol id="ic-cloud" viewBox="0 0 24 24">
      <path d="M6.5 18 C3.5 18 2 15.8 2 13.8 C2 11.6 3.8 10 5.8 10.1 C6.4 7.6 8.7 6 11.2 6.3 C13.6 6.6 15.4 8.6 15.5 11 C17.9 11.1 20 13 20 15.3 C20 17.4 18.2 18 17 18 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-box" viewBox="0 0 24 24">
      <path d="M3 8 L12 4 L21 8 L12 12 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M3 8 V17 L12 21 V12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M21 8 V17 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="3" y="14" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="7" cy="7" r="1" fill="currentColor"/>
      <circle cx="7" cy="17" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ic-monitor" viewBox="0 0 24 24">
      <rect x="2.5" y="4" width="19" height="13" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-folder" viewBox="0 0 24 24">
      <path d="M3 6.5 C3 5.7 3.7 5 4.5 5 H9.5 L11.5 7.5 H19.5 C20.3 7.5 21 8.2 21 9 V17.5 C21 18.3 20.3 19 19.5 19 H4.5 C3.7 19 3 18.3 3 17.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24">
      <path d="M6 3 H14 L19 8 V20 C19 20.6 18.6 21 18 21 H6 C5.4 21 5 20.6 5 20 V4 C5 3.4 5.4 3 6 3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14 3 V8 H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="15.5" x2="16" y2="15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="19" x2="12.5" y2="19" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-terminal" viewBox="0 0 24 24">
      <rect x="2.5" y="4" width="19" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M6.5 9 L10.5 12 L6.5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="15" x2="17" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>
</defs>
<rect x="0" y="0" width="1164" height="426" fill="#FFFFFF"/>

  <g transform="translate(40,20)">
    <path d="M12 42 V16" stroke="#1B4332" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M12 23 C12 14 5 12 0 14 C0 21 5 25 12 23 Z" fill="#74C69D" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12 19 C12 11 20 9 25 11 C25 18 20 22 12 19 Z" fill="#95D5B2" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">Offline utilities</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">Stage packages and tools on a connected machine, to install from later with no network at all.</text>

<rect x="40" y="128" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="148" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed download-whls &lt;package...&gt;</text>
<text x="364" y="146" class="body" font-size="12.5" fill="#52796F">Downloads a package and its dependencies as .whl files into ./wheelhouse, to carry to an air-gapped machine.</text>
<rect x="40" y="168" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="188" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed download-requirements &lt;req.txt&gt;</text>
<text x="364" y="186" class="body" font-size="12.5" fill="#52796F">Same as download-whls, reading specifiers from a requirements file.</text>
<rect x="40" y="210" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="230" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed download-forge &lt;name...&gt;</text>
<text x="364" y="220" class="body" font-size="12.5" fill="#52796F">Resolves a conda-forge tool and its dependencies into a local conda channel folder -- the download-whls of the</text>
<text x="364" y="237" class="body" font-size="12.5" fill="#52796F">conda-forge side.</text>
<rect x="40" y="252" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="272" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed whl-licenses &lt;dir&gt;</text>
<text x="364" y="270" class="body" font-size="12.5" fill="#52796F">What every wheel in a directory is licensed under, read from each wheel's own metadata -- before it ships to a share.</text>
<rect x="40" y="292" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="312" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed forge-licenses [dir]</text>
<text x="364" y="310" class="body" font-size="12.5" fill="#52796F">The same for a bundled conda channel, read from its repodata.</text>
<rect x="40" y="334" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="354" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed upload-whls &lt;dir&gt;</text>
<text x="364" y="344" class="body" font-size="12.5" fill="#52796F">Publishes a wheel directory INTO your internal package index, for networks whose air gap has a door. Runs uvx twine</text>
<text x="364" y="361" class="body" font-size="12.5" fill="#52796F">upload.</text>
</svg>
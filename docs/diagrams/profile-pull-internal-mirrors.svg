  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">Internal mirrors</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">No bundle needed -- the mirrors are reachable</text>

<rect x="640" y="150" width="320" height="218" rx="12" fill="#1B4332"/>
<use href="#ic-doc" x="658" y="163" width="22" height="22" color="#FFFFFF"/>
<text x="692" y="178" class="body fw" font-size="14.0" font-weight="700">seedling-profile.toml</text>
<text x="658" y="194" class="body" fill="#CFE3D6" font-size="10" font-style="italic">one file, read at install and every</text>
<text x="658" y="206" class="body" fill="#CFE3D6" font-size="10" font-style="italic">later `seed apply`</text>

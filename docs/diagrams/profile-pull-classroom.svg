  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">Classroom</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">Pinned, reproducible -- installs straight from the internet</text>

<rect x="640" y="150" width="320" height="162" rx="12" fill="#1B4332"/>
<use href="#ic-doc" x="658" y="163" width="22" height="22" color="#FFFFFF"/>
<text x="692" y="178" class="body fw" font-size="14.0" font-weight="700">seedling-profile.toml</text>
<text x="658" y="194" class="body" fill="#CFE3D6" font-size="10" font-style="italic">one file, read at install and every</text>
<text x="658" y="206" class="body" fill="#CFE3D6" font-size="10" font-style="italic">later `seed apply`</text>
<line x1="658" y1="216" x2="942" y2="216" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
<rect x="658" y="224" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="239" class="body fg" font-size="11.5" font-weight="600">python = [...]  →  python/base/</text>
<rect x="658" y="252" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="267" class="body fg" font-size="11.5" font-weight="600">[[venv]]  →  python/venvs/</text>
<rect x="658" y="280" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="295" class="body fg" font-size="11.5" font-weight="600">editor = ...  →  extensions/</text>
<line x1="800" y1="312" x2="800" y2="350" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="810" y="337" class="body fmute" font-size="10.5" font-style="italic">install + seed apply</text>
<rect x="640" y="354" width="320" height="312" rx="12" fill="#EAF3EE" stroke="#1B4332" stroke-width="1.2"/>
<use href="#ic-monitor" x="662" y="358" width="24" height="24" color="#1B4332"/>
<text x="696" y="375" class="body fg" font-size="15" font-weight="700">YOUR MACHINE</text>
<text x="662" y="392" class="body fmute" font-size="11.5" font-style="italic">every lab machine, identical pins</text>
<line x1="662" y1="397" x2="938" y2="397" stroke="#1B4332" stroke-width="1" opacity="0.25"/>
<text x="662" y="408" class="body fg" font-size="10.5" font-weight="700" letter-spacing="0.6">WHAT THE USER HAS</text>
<rect x="654" y="422" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="428" width="15" height="15" color="#1B4332"/>
<text x="681" y="439" class="body fg" font-size="12.0" font-weight="700">python/base/</text>
<text x="681" y="450" class="body fmute" font-size="9.5" font-style="italic">interpreters</text>
<rect x="664" y="454" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="468" class="body fg" font-size="11.5" font-weight="600">3.12</text>
<rect x="654" y="497" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="503" width="15" height="15" color="#1B4332"/>
<text x="681" y="514" class="body fg" font-size="12.0" font-weight="700">python/venvs/</text>
<text x="681" y="525" class="body fmute" font-size="9.5" font-style="italic">one folder per venv</text>
<rect x="664" y="529" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="544" class="body fg" font-size="11.5" font-weight="600">phys201</text>
<rect x="654" y="572" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="578" width="15" height="15" color="#1B4332"/>
<text x="681" y="589" class="body fg" font-size="12.0" font-weight="700">extensions/spyder-config/</text>
<text x="681" y="600" class="body fmute" font-size="9.5" font-style="italic">the editor's local settings</text>
<rect x="664" y="604" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="618" class="body fg" font-size="11.5" font-weight="600">Spyder</text>
<rect x="40" y="444" width="470" height="132" rx="12" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.3"/>

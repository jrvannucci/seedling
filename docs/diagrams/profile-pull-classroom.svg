<text x="84" y="471" class="body fg" font-size="15.0" font-weight="700">pypi.org</text>
<text x="84" y="485" class="body fmute" font-size="11.0" font-style="italic">package index</text>
<rect x="54" y="490" width="442" height="32" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="66" y="511" class="body fg" font-size="13.0" font-weight="700">Packages (pinned)</text>
<line x1="510" y1="506" x2="636" y2="506" stroke="#1B4332" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="575" y="500" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">seed apply</text>
<rect x="54" y="530" width="442" height="32" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="66" y="551" class="body fg" font-size="13.0" font-weight="700">Spyder</text>
<line x1="510" y1="546" x2="636" y2="546" stroke="#1B4332" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="575" y="540" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">seed spyder</text>
<text x="40" y="700" class="body fmute" font-size="12" font-style="italic">If the lab machines have no internet, build a bundle instead -- see Air-gapped (everything) and take only the pieces you need.</text>
</svg>
  <line x1="60" y1="908" x2="1540" y2="908" stroke="#1B4332" stroke-width="1.6"/>

  <!-- ============ Footnotes ============ -->
  <text x="60" y="944" class="fmute" font-size="13.5">
    <tspan font-weight="700" class="fg">Index</tspan> means a package source is SET, not that you need an Artifactory — a URL for the networked
  </text>
  <text x="60" y="966" class="fmute" font-size="13.5">
    examples, a wheels folder on the share for the air-gapped ones. <tspan font-weight="700" class="fg">x86_64 only</tspan> comes solely from Spyder
    (no arm64 Qt wheels) — everything else runs on arm64 fine.
  </text>

  <!-- row 9: Just Python -->
  <text x="60" y="882" class="fg" font-size="13.5" font-weight="700">Just Python</text>
  <text x="270" y="882" class="fmute" font-size="13.5">Interpreters and venvs only</text>
  <use href="#no" x="646" y="855" width="26" height="26"/>
  <use href="#no" x="764" y="855" width="26" height="26"/>
  <use href="#no" x="881" y="855" width="26" height="26"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .head   { font-family: Georgia, 'Times New Roman', serif; }
      .fg     { fill: #1B4332; }
      .fmute  { fill: #52796F; }
      .stroke2  { stroke: #FFFFFF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="yes" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#1B4332"/>
      <path d="M7 12.3 L10.4 15.7 L17 8.6" class="stroke2" stroke-width="2.4"/>
    </symbol>
    <symbol id="no" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="none" stroke="#C7D6CD" stroke-width="2"/>
    </symbol>
    <symbol id="warn" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#D4A373"/>
      <line x1="12" y1="7" x2="12" y2="13.6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="12" cy="16.8" r="1.3" fill="#FFFFFF"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1600" height="1020" fill="#FFFFFF"/>

  <!-- ============ Header ============ -->
  <g transform="translate(56,20)">
    <path d="M12 46 V18" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M12 26 C12 15 4 13 -2 15 C-2 24 4 29 12 26 Z" fill="#74C69D" stroke="#1B4332" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M12 21 C12 12 22 10 28 12 C28 20 22 24 12 21 Z" fill="#95D5B2" stroke="#1B4332" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="118" y="60" class="head fg" font-size="32" font-weight="700">Ten ready-made deployment profiles</text>
  <text x="60" y="90" class="fmute" font-size="15.5" font-style="italic">seedling-profile.toml starting points — what each one needs, and what it skips</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(60,110)" font-size="13.5">
    <use href="#yes" x="0" y="0" width="22" height="22"/>
    <text x="30" y="16" class="fg">needed / available</text>
    <use href="#no" x="215" y="0" width="22" height="22"/>
    <text x="245" y="16" class="fg">not needed</text>
    <use href="#warn" x="410" y="0" width="22" height="22"/>
    <text x="440" y="16" class="fg">depends — see the profile</text>
  </g>

  <!-- ============ Table header ============ -->
  <line x1="60" y1="228" x2="1540" y2="228" stroke="#1B4332" stroke-width="1.6"/>
  <text x="60" y="216" class="fg" font-size="14" font-weight="700">Profile</text>
  <text x="270" y="216" class="fg" font-size="14" font-weight="700">What it's for</text>
  <g font-size="13" font-weight="700" class="fg">
    <g transform="translate(659,214) rotate(-32)"><text text-anchor="start">Offline</text></g>
    <g transform="translate(777,214) rotate(-32)"><text text-anchor="start">Index</text></g>
    <g transform="translate(894,214) rotate(-32)"><text text-anchor="start">VS Code</text></g>
    <g transform="translate(1011,214) rotate(-32)"><text text-anchor="start">Spyder</text></g>
    <g transform="translate(1129,214) rotate(-32)"><text text-anchor="start">conda-forge</text></g>
    <g transform="translate(1246,214) rotate(-32)"><text text-anchor="start">CA certs</text></g>
    <g transform="translate(1364,214) rotate(-32)"><text text-anchor="start">Bundle</text></g>
    <g transform="translate(1481,214) rotate(-32)"><text text-anchor="start">x86_64 only</text></g>
  </g>


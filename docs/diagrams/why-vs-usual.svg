<rect x="40" y="190" width="330" height="96" rx="10" fill="#9C4A3C" stroke="#9C4A3C" stroke-width="1.4"/><text x="205" y="223" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#FFFFFF">research, install, and connect several tools —</text><text x="205" y="243" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#FFFFFF">hours of setup and decisions</text><text x="205" y="263" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#FFFFFF">before your first line of code</text>

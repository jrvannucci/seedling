<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 856" font-family="Arial, Helvetica, sans-serif">
<defs>
  <defs>
    <style>
      .head  { font-family: Georgia, 'Times New Roman', serif; }
      .body  { font-family: Arial, Helvetica, sans-serif; }
      .fg    { fill: #1B4332; }
      .fw    { fill: #FFFFFF; }
      .fmute { fill: #52796F; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1B4332"/>
    </marker>
    <symbol id="ic-cloud" viewBox="0 0 24 24">
      <path d="M6.5 18 C3.5 18 2 15.8 2 13.8 C2 11.6 3.8 10 5.8 10.1 C6.4 7.6 8.7 6 11.2 6.3 C13.6 6.6 15.4 8.6 15.5 11 C17.9 11.1 20 13 20 15.3 C20 17.4 18.2 18 17 18 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-box" viewBox="0 0 24 24">
      <path d="M3 8 L12 4 L21 8 L12 12 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M3 8 V17 L12 21 V12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M21 8 V17 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="3" y="14" width="18" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="7" cy="7" r="1" fill="currentColor"/>
      <circle cx="7" cy="17" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ic-monitor" viewBox="0 0 24 24">
      <rect x="2.5" y="4" width="19" height="13" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-folder" viewBox="0 0 24 24">
      <path d="M3 6.5 C3 5.7 3.7 5 4.5 5 H9.5 L11.5 7.5 H19.5 C20.3 7.5 21 8.2 21 9 V17.5 C21 18.3 20.3 19 19.5 19 H4.5 C3.7 19 3 18.3 3 17.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24">
      <path d="M6 3 H14 L19 8 V20 C19 20.6 18.6 21 18 21 H6 C5.4 21 5 20.6 5 20 V4 C5 3.4 5.4 3 6 3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14 3 V8 H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="15.5" x2="16" y2="15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="19" x2="12.5" y2="19" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
  </defs>
</defs>
<rect x="0" y="0" width="1164" height="856" fill="#FFFFFF"/>

  <g transform="translate(40,20)">
    <path d="M12 42 V16" stroke="#1B4332" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M12 23 C12 14 5 12 0 14 C0 21 5 25 12 23 Z" fill="#74C69D" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12 19 C12 11 20 9 25 11 C25 18 20 22 12 19 Z" fill="#95D5B2" stroke="#1B4332" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">Venvs &amp; packages</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">The day-to-day family: creating and switching environments, and installing packages into them.</text>

<text x="40" y="142" class="body" font-size="12.5" font-weight="700" fill="#52796F" letter-spacing="0.4">CREATE &amp; SWITCH</text>
<rect x="40" y="154" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="174" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed venv &lt;name&gt; [--python tag]</text>
<text x="364" y="172" class="body" font-size="12.5" fill="#52796F">Creates a venv from a base interpreter and installs the default package set into it.</text>
<rect x="40" y="194" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="214" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed venv-list [--json]</text>
<text x="364" y="212" class="body" font-size="12.5" fill="#52796F">Lists every venv, its Python version, and which one is active.</text>
<rect x="40" y="234" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="254" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed activate &lt;name&gt;</text>
<text x="364" y="252" class="body" font-size="12.5" fill="#52796F">Activates a venv in the current shell.</text>
<rect x="40" y="274" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="294" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed deactivate</text>
<text x="364" y="292" class="body" font-size="12.5" fill="#52796F">Deactivates whatever venv is active in the current shell.</text>
<rect x="40" y="314" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="334" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed run [-n venv] -- &lt;cmd&gt;</text>
<text x="364" y="332" class="body" font-size="12.5" fill="#52796F">Runs one command inside a venv without activating anything -- exit code and output pass through untouched.</text>
<rect x="40" y="354" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="374" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed which [name] [--json]</text>
<text x="364" y="372" class="body" font-size="12.5" fill="#52796F">Prints a venv's interpreter path, and nothing else.</text>
<rect x="40" y="394" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="414" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed venv-default [name]</text>
<text x="364" y="412" class="body" font-size="12.5" fill="#52796F">Shows or sets the venv every new shell auto-activates -- writes default_venv to settings.json, not to the venv itself.</text>
<rect x="40" y="434" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="454" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed auto-activate [True|False]</text>
<text x="364" y="452" class="body" font-size="12.5" fill="#52796F">Turns auto-activation of the default venv on or off -- also just a settings.json write.</text>
<text x="40" y="508" class="body" font-size="12.5" font-weight="700" fill="#52796F" letter-spacing="0.4">PACKAGES</text>
<rect x="40" y="520" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="540" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed install &lt;package...&gt;</text>
<text x="364" y="538" class="body" font-size="12.5" fill="#52796F">Passthrough to `uv pip install`, into the active venv.</text>
<rect x="40" y="560" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="580" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed uninstall &lt;package...&gt;</text>
<text x="364" y="578" class="body" font-size="12.5" fill="#52796F">Passthrough to `uv pip uninstall`.</text>
<rect x="40" y="600" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="620" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed package-list [--json]</text>
<text x="364" y="618" class="body" font-size="12.5" fill="#52796F">Passthrough to `uv pip list` for the active venv.</text>
<rect x="40" y="640" width="300" height="30" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.95"/>
<text x="52" y="660" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1B4332">seed show &lt;package...&gt;</text>
<text x="364" y="658" class="body" font-size="12.5" fill="#52796F">Passthrough to `uv pip show` -- full detail on one installed package.</text>
<text x="40" y="714" class="body" font-size="12.5" font-weight="700" fill="#9C4A3C" letter-spacing="0.4">DANGER ZONE</text>
<rect x="40" y="726" width="300" height="30" rx="8" fill="#F5E8E5" stroke="#9C4A3C" stroke-width="1" opacity="0.95"/>
<text x="52" y="746" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#9C4A3C">seed remove-venv &lt;name&gt;</text>
<text x="364" y="744" class="body" font-size="12.5" fill="#52796F">Deletes one venv, force-closing anything holding it open first.</text>
<rect x="40" y="766" width="300" height="30" rx="8" fill="#F5E8E5" stroke="#9C4A3C" stroke-width="1" opacity="0.95"/>
<text x="52" y="786" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#9C4A3C">seed remove-venv-all</text>
<text x="364" y="784" class="body" font-size="12.5" fill="#52796F">Deletes every venv under python/venvs.</text>
</svg>